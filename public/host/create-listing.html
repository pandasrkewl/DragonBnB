<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing | DrexelBnB</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
<header>
    <h1>
        <a href="../index.html">
            DrexelBnB
        </a>
    </h1>

    <nav>
        <a href="dashboard.html">
            Dashboard
        </a>
        <a href="../login.html">
            Logout
        </a>
    </nav>
</header>

<main>
<h2>Create a Listing</h2>
<div class="form-container">
<form action="property-info.html">
<h3>
What type of property is it?
</h3>

<div class="radio-group">
<label>
<input 
type="radio" 
name="property-type"
value="House"
required>
House
</label>

<label>
<input 
type="radio" 
name="property-type"
value="Apartment">
Apartment
</label>

<label>
<input 
type="radio" 
name="property-type"
value="Room">
Room
</label>

<label>
<input 
type="radio" 
name="property-type"
value="Hotel">
Hotel
</label>
</div>

<div class="form-group">
<label>
Guests
</label>

<select name="guests">
<option value="1">
1 Guest
</option>

<option value="2">
2 Guests
</option>

<option value="4">
4 Guests
</option>

<option value="6">
6 Guests
</option>

<option value="8">
8 Guests
</option>
</select>
</div>

<div class="form-group">
<label>
Bedrooms
</label>
<select name="bedrooms">
<option value="1">
1 Bedroom
</option>

<option value="2">
2 Bedrooms
</option>

<option value="3">
3 Bedrooms
</option>

<option value="4">
4 Bedrooms
</option>
</select>
</div>

<div class="form-group">
<label>
Bathrooms
</label>

<select name="bathrooms">
<option value="1">
1 Bathroom
</option>

<option value="2">
2 Bathrooms
</option>

<option value="3">
3 Bathrooms
</option>
</select>
</div>

<button type="submit">
Continue
</button>
</form>
</div>
</main>

<footer>
CS375 Summer Project
</footer>
</body>
</html>
